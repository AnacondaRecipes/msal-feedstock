{% set name = "msal" %}
{% set version = "1.39.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 6ab7de335e6d7f5717e2c7e1dbf86e4dda2f6acf3c56773b78dc53ebc6395b5f

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools
  run:
    - python
    - requests >=2.0.0,<3
    - pyjwt >=1.0.0,<3
    - cryptography >=2.5,<51
  run_constrained:
    - pymsalruntime >=0.20,<0.21

test:
  requires:
    - pip
  imports:
    - msal
    - msal.application
    - msal.authority
    - msal.cloudshell
    - msal.exceptions
    - msal.individual_cache
    - msal.managed_identity
    - msal.mex
    - msal.oauth2cli
    - msal.oauth2cli.authcode
    - msal.oauth2cli.oidc
    - msal.telemetry
    - msal.throttled_http_client
    - msal.token_cache
    - msal.wstrust_response
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # upstream tests need helper modules omitted from the sdist (tests/http_client.py, tests/broker_util.py, tests/lab_config.py)

about:
  home: https://github.com/AzureAD/microsoft-authentication-library-for-python
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Microsoft Authentication Library (MSAL) for Python makes it easy to authenticate to Azure Active Directory
  description: |
    The MSAL library for Python enables your app to access the Microsoft Cloud by supporting
    authentication of users with Microsoft Azure Active Directory accounts and Microsoft Accounts
    using industry standard OAuth2 and OpenID Connect.
  doc_url: https://msal-python.readthedocs.io
  dev_url: https://github.com/AzureAD/microsoft-authentication-library-for-python

extra:
  recipe-maintainers:
    - roederja
    - dhirschfeld
